# Tag-triggered release: build on each OS, attach archives to a GitHub release.
#
# # Why this is written out rather than generated by cargo-dist
#
# Prompt 19 names `cargo-dist`/`cargo-packager`. Both work, and both add a tool whose own version
# has to be kept in step with a generated workflow that must then not be hand-edited — a second
# configuration to keep correct, for a project that ships two binaries and no installer. What the
# prompt actually *constrains* is that "release artifacts must be reproducible from a clean checkout
# via CI alone, no manually-assembled release step", and a workflow that runs `cargo build --release`
# and uploads what it produced satisfies that while staying readable by anyone who knows cargo.
#
# Revisit this the moment the project wants real installers — an `.msi`, a signed `.app`, a `.deb`.
# That is exactly what those tools are good at and exactly where hand-writing stops paying.
#
# # Reproducing a release locally
#
#   cargo build --release -p frontend-native -p frontend-headless
#
# The archives below are that, plus the licences and a README. Nothing is assembled by hand and
# nothing is signed, which is stated in the release notes rather than left for a user to discover
# from their OS refusing to open it.

name: Release

on:
  push:
    tags: ["v*"]
  # Buildable on demand, so the packaging can be exercised without inventing a tag for it.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every target is attempted even if one fails, so a broken Windows build does not hide a
      # broken macOS one for a whole release cycle.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # The same list `cargo xtask setup` prints. These three must move together — see SETUP.md.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev pkg-config

      # No toolchain pin here: `rust-toolchain.toml` selects it, which is the point of having one.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN || '1.97.1' }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p frontend-native -p frontend-headless

      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          name="alpha-emulator-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "staging/$name"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/frontend-native$ext" "staging/$name/alpha-emulator$ext"
          cp "target/${{ matrix.target }}/release/frontend-headless$ext" "staging/$name/alpha-headless$ext"
          # Licences travel with the binaries; a dual-licensed project that ships neither file is
          # not actually offering the choice it claims to.
          cp LICENSE-MIT LICENSE-APACHE README.md "staging/$name/" 2>/dev/null || cp README.md "staging/$name/"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C staging -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: (cd staging && 7z a "../${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    name: publish release
    # Only a real tag publishes. A `workflow_dispatch` run builds and stops, which is what makes it
    # safe to use for checking that packaging still works.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          body: |
            Built by CI from the tagged commit. Nothing here is code-signed or notarised, so
            macOS and Windows will both warn on first run — that is expected for an unsigned
            build, not a sign the archive is wrong.

            `alpha-emulator` is the windowed application; `alpha-headless` is the CLI driver.
            See README.md for what each system actually does today.
